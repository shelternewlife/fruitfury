name: Validate Fruit Fury Slice website
on:
  pull_request:
    branches: [main]
  push:
    branches: [fruitfury-rebrand]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Fruit Fury content tests
        run: python -m unittest discover -s tests -p 'test_fruitfury.py' -v
      - name: Build static site
        run: python scripts/build.py
      - name: Validate generated pages, routes and sitemaps
        run: python scripts/validate.py
